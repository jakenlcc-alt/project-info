<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kickoff Checklist</title>
  <meta name="description" content="Project kickoff checklist intake form." />
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --ink: #1c2430;
      --muted: #5e6b7a;
      --line: #dce3ea;
      --accent: #1f6feb;
      --accent-ink: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      padding: 2rem 1rem 4rem;
    }
    .wrap { max-width: 820px; margin: 0 auto; }
    header.page { margin-bottom: 1.5rem; }
    header.page h1 { margin: 0 0 0.25rem; font-size: 1.9rem; }
    header.page p { margin: 0; color: var(--muted); }

    /* Section cards — title sits cleanly inside the box, not on the border */
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1.25rem 1.5rem 1.5rem;
      margin: 0 0 1.25rem;
      min-width: 0;
    }
    .card-title {
      margin: 0 0 1.1rem;
      padding-bottom: 0.65rem;
      border-bottom: 1px solid var(--line);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
    }

    .field { margin-bottom: 1rem; }
    .field:last-child { margin-bottom: 0; }
    label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 0.35rem; }
    label .hint { font-weight: 400; color: var(--muted); }
    input[type="text"], input[type="date"], textarea {
      width: 100%;
      padding: 0.6rem 0.7rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      font: inherit;
      color: var(--ink);
      background: #fbfcfd;
    }
    input:focus, textarea:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
    textarea { resize: vertical; min-height: 72px; }

    .row2 { display: grid; gap: 1rem 1.25rem; grid-template-columns: 1fr 1fr; }
    .subfield { margin-top: 0.25rem; margin-left: 1.25rem; padding-left: 0.9rem; border-left: 2px solid var(--line); }

    .checks { display: grid; gap: 0.6rem 1.25rem; grid-template-columns: 1fr 1fr; }
    .check {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.6rem 0.7rem; border: 1px solid var(--line); border-radius: 8px; background: #fbfcfd;
    }
    .check input { width: 1.05rem; height: 1.05rem; margin: 0; accent-color: var(--accent); flex: none; }
    .check label { margin: 0; font-weight: 500; }

    .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; margin-top: 0.25rem; }
    button { font: inherit; font-weight: 600; cursor: pointer; padding: 0.7rem 1.4rem; border-radius: 8px; border: 1px solid transparent; }
    button.primary { background: var(--accent); color: var(--accent-ink); }
    button.secondary { background: #fff; color: var(--ink); border-color: var(--line); }
    #status { font-size: 0.9rem; color: var(--muted); }
    pre { background: #0d1117; color: #e6edf3; padding: 1rem; border-radius: 8px; overflow: auto; font-size: 0.8rem; display: none; margin-top: 1rem; }

    @media (max-width: 640px) {
      body { padding: 1.25rem 0.85rem 3rem; }
      .row2, .checks { grid-template-columns: 1fr; }
      .card { padding: 1.1rem 1.1rem 1.25rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="page">
      <h1>Kickoff Checklist</h1>
      <p>Complete at project kickoff. Fields mirror the standard kickoff checklist.</p>
    </header>

    <form id="kickoff">
      <fieldset class="card">
        <h2 class="card-title">Overview</h2>
        <div class="field">
          <label for="project">Project</label>
          <input type="text" id="project" name="project" />
        </div>
        <div class="row2">
          <div class="field">
            <label for="builder">Builder</label>
            <input type="text" id="builder" name="builder" />
          </div>
          <div class="field">
            <label for="builderPoc">Builder POC info <span class="hint">(name / phone / email)</span></label>
            <input type="text" id="builderPoc" name="builderPoc" />
          </div>
        </div>
      </fieldset>

      <fieldset class="card">
        <h2 class="card-title">Time Schedule</h2>
        <div class="row2">
          <div class="field">
            <label for="startDate">Estimated Start Date</label>
            <input type="date" id="startDate" name="startDate" />
          </div>
          <div class="field">
            <label for="duration">Estimated Duration</label>
            <input type="text" id="duration" name="duration" placeholder="e.g. 6 weeks" />
          </div>
        </div>
      </fieldset>

      <fieldset class="card">
        <h2 class="card-title">Invoicing</h2>
        <div class="field">
          <label for="invoicing">Invoicing <span class="hint">(terms / schedule / billing contact)</span></label>
          <textarea id="invoicing" name="invoicing"></textarea>
        </div>
      </fieldset>

      <fieldset class="card">
        <h2 class="card-title">Resources</h2>
        <div class="field">
          <label for="materialOrdering">Material ordering</label>
          <input type="text" id="materialOrdering" name="materialOrdering" />
        </div>
        <div class="field subfield">
          <label for="suppliers">What supplier(s)?</label>
          <input type="text" id="suppliers" name="suppliers" />
        </div>
        <div class="field">
          <label for="materialQuotes">Material quotes</label>
          <input type="text" id="materialQuotes" name="materialQuotes" />
        </div>
        <div class="field">
          <label for="equipment">Equipment needs</label>
          <input type="text" id="equipment" name="equipment" />
        </div>
        <div class="field">
          <label for="manpower">Manpower</label>
          <input type="text" id="manpower" name="manpower" />
        </div>
      </fieldset>

      <fieldset class="card">
        <h2 class="card-title">Additional Office Binder Needs</h2>
        <div class="checks" id="binderChecks"></div>
      </fieldset>

      <fieldset class="card">
        <h2 class="card-title">Other &ndash; Binders</h2>
        <div class="checks" id="otherChecks"></div>
      </fieldset>

      <fieldset class="card">
        <h2 class="card-title">Hand-off Meeting</h2>
        <div class="row2">
          <div class="field">
            <label for="handoffWho">Who</label>
            <input type="text" id="handoffWho" name="handoffWho" />
          </div>
          <div class="field">
            <label for="handoffDate">Date</label>
            <input type="date" id="handoffDate" name="handoffDate" />
          </div>
        </div>
      </fieldset>

      <div class="actions">
        <button type="submit" class="primary">Submit</button>
        <button type="button" class="secondary" id="previewBtn">Preview data</button>
        <span id="status"></span>
      </div>
      <pre id="output"></pre>
    </form>
  </div>

  <script>
    // Office binder checklist items (from the kickoff checklist document)
    const BINDER_ITEMS = [
      "Statement of Values", "Job cost sheet", "New Job information sheet",
      "Estimate", "Contract", "Architecture drawings", "Shop Drawings",
      "Takeoff", "Submittals", "Submittal approval", "Scope", "Road Map", "Spec Sheet"
    ];
    const OTHER_ITEMS = ["Safety Plan Binder"];

    function renderChecks(containerId, items, group) {
      const el = document.getElementById(containerId);
      el.innerHTML = items.map((item, i) => {
        const id = group + "_" + i;
        return '<div class="check">' +
          '<input type="checkbox" id="' + id + '" data-group="' + group + '" value="' + item + '" />' +
          '<label for="' + id + '">' + item + '</label>' +
        '</div>';
      }).join("");
    }
    renderChecks("binderChecks", BINDER_ITEMS, "binder");
    renderChecks("otherChecks", OTHER_ITEMS, "other");

    function collect() {
      const f = document.getElementById("kickoff");
      return {
        overview: {
          project: f.project.value.trim(),
          builder: f.builder.value.trim(),
          builderPoc: f.builderPoc.value.trim()
        },
        timeSchedule: {
          estimatedStartDate: f.startDate.value,
          estimatedDuration: f.duration.value.trim()
        },
        invoicing: f.invoicing.value.trim(),
        resources: {
          materialOrdering: f.materialOrdering.value.trim(),
          suppliers: f.suppliers.value.trim(),
          materialQuotes: f.materialQuotes.value.trim(),
          equipmentNeeds: f.equipment.value.trim(),
          manpower: f.manpower.value.trim()
        },
        officeBinderNeeds: [...document.querySelectorAll('[data-group="binder"]:checked')].map(c => c.value),
        otherBinders: [...document.querySelectorAll('[data-group="other"]:checked')].map(c => c.value),
        handoffMeeting: { who: f.handoffWho.value.trim(), date: f.handoffDate.value },
        submittedAt: new Date().toISOString()
      };
    }

    document.getElementById("previewBtn").addEventListener("click", () => {
      const out = document.getElementById("output");
      out.style.display = "block";
      out.textContent = JSON.stringify(collect(), null, 2);
    });

    // Cloudflare Worker that proxies to the monday.com GraphQL API (injects the token).
    const SUBMIT_URL = "https://monday-token-keeper.jake-nlcc.workers.dev";
    // monday.com board ID for kickoff items — the number in the board URL:
    //   https://<account>.monday.com/boards/XXXXXXXXX   <-- that XXXXXXXXX
    const BOARD_ID = "";

    // Readable summary of the checklist, posted to the item's Updates feed.
    function buildSummary(d) {
      const list = (arr) => (arr.length ? arr.map(x => "• " + x).join("\n") : "—");
      return [
        "KICKOFF CHECKLIST", "",
        "Overview",
        "Project: " + (d.overview.project || "—"),
        "Builder: " + (d.overview.builder || "—"),
        "Builder POC: " + (d.overview.builderPoc || "—"), "",
        "Time Schedule",
        "Estimated Start Date: " + (d.timeSchedule.estimatedStartDate || "—"),
        "Estimated Duration: " + (d.timeSchedule.estimatedDuration || "—"), "",
        "Invoicing: " + (d.invoicing || "—"), "",
        "Resources",
        "Material ordering: " + (d.resources.materialOrdering || "—"),
        "Supplier(s): " + (d.resources.suppliers || "—"),
        "Material quotes: " + (d.resources.materialQuotes || "—"),
        "Equipment needs: " + (d.resources.equipmentNeeds || "—"),
        "Manpower: " + (d.resources.manpower || "—"), "",
        "Additional Office Binder Needs", list(d.officeBinderNeeds), "",
        "Other – Binders", list(d.otherBinders), "",
        "Hand-off Meeting",
        "Who: " + (d.handoffMeeting.who || "—"),
        "Date: " + (d.handoffMeeting.date || "—")
      ].join("\n");
    }

    // Send a GraphQL request to monday via the Worker; throw on monday errors.
    async function mondayQuery(query, variables) {
      const res = await fetch(SUBMIT_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query, variables })
      });
      const json = await res.json();
      if (json.errors) throw new Error(json.errors.map(e => e.message).join("; "));
      if (json.error) throw new Error(json.error);
      return json.data;
    }

    document.getElementById("kickoff").addEventListener("submit", async (e) => {
      e.preventDefault();
      const status = document.getElementById("status");
      const out = document.getElementById("output");
      const data = collect();

      if (!SUBMIT_URL || !BOARD_ID) {
        out.style.display = "block";
        out.textContent = JSON.stringify(data, null, 2);
        status.textContent = "BOARD_ID not set — showing data below. Add the monday board ID to enable submitting.";
        return;
      }
      if (!data.overview.project) { status.textContent = "Enter a Project name first."; return; }

      status.textContent = "Submitting to monday…";
      try {
        // 1) Create the item, named after the project.
        const created = await mondayQuery(
          "mutation ($boardId: ID!, $itemName: String!) {" +
          "  create_item (board_id: $boardId, item_name: $itemName) { id }" +
          "}",
          { boardId: String(BOARD_ID), itemName: "Kickoff – " + data.overview.project }
        );
        const itemId = created.create_item.id;

        // 2) Post the full filled-out checklist to the item's Updates feed.
        await mondayQuery(
          "mutation ($itemId: ID!, $body: String!) {" +
          "  create_update (item_id: $itemId, body: $body) { id }" +
          "}",
          { itemId: String(itemId), body: buildSummary(data) }
        );

        status.textContent = "Created monday item #" + itemId + " ✓";
        e.target.reset();
      } catch (err) {
        status.textContent = "Error: " + err.message;
        out.style.display = "block";
        out.textContent = JSON.stringify(data, null, 2);
      }
    });
  </script>
</body>
</html>
