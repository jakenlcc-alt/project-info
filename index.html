<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>project-info</title>
  <meta name="description" content="project-info — deployed from main via Netlify." />
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0d1117;
      color: #e6edf3;
    }
    main { max-width: 40rem; text-align: center; }
    .badge {
      display: inline-block;
      margin-bottom: 1.5rem;
      padding: 0.25rem 0.75rem;
      border: 1px solid #2ea043;
      border-radius: 999px;
      color: #3fb950;
      font-size: 0.8rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 0.5rem; font-size: 2.5rem; }
    p { margin: 0 0 1.5rem; font-size: 1.1rem; line-height: 1.6; color: #9da7b3; }
    code { padding: 0.15rem 0.4rem; border-radius: 4px; background: #161b22; font-size: 0.9em; }
    footer { margin-top: 2rem; font-size: 0.85rem; color: #6e7681; }
    a { color: #58a6ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <span class="badge">Live</span>
    <h1>project-info</h1>
    <p>This site deploys automatically from the <code>main</code> branch via Netlify.</p>
    <p>Replace this page with your own content — edit <code>index.html</code> and push to <code>main</code>.</p>
    <footer>
      Deployed with Netlify ·
      <a href="https://github.com/jakenlcc-alt/project-info">GitHub</a>
    </footer>
  </main>
</body>
</html>
